org: techgrowthlabs
app: conversales-api
service: conversales-api
frameworkVersion: "3"

plugins:
  - serverless-plugin-typescript
  - serverless-dotenv-plugin

provider:
  name: aws
  runtime: nodejs20.x
  region: sa-east-1
  logs:
    restApi: true

custom:
  scripts:
    hooks:
      "before:deploy:deploy": "npm run build"
      "after:deploy:deploy": "npm run clean"
  certificatePath: ${file(./certify.p12)}

functions:
  webhook-whatsapp:
    handler: src/webhook/index.whatsapp
    events:
      - httpApi:
          path: /{companyId}/webhook/whatsapp
          method: post

  webhook-telegram:
    handler: src/webhook/index.telegram
    timeout: 30
    events:
      - httpApi:
          path: /{companyId}/webhook/telegram
          method: post

  set-webhook:
    handler: src/webhook/index.setEfiWebhook
    events:
      - httpApi:
          path: /{companyId}/webhook/{hmac}
          method: post

  pix-webhook:
    handler: src/webhook/index.pix
    events:
      - httpApi:
          path: /{companyId}/webhook/{hmac}/pix
          method: post

package:
  include:
    - certify.p12
